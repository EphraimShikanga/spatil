# Spatil example configuration.
#
# Copy this to ~/.config/spatil/spatil.toml (respects $XDG_CONFIG_HOME) and edit.
# Every section and field is optional: anything you omit falls back to the
# built-in default shown here, so a partial file is always valid. Saving the
# file live-reloads it — no restart needed for keybindings, keyboard repeat /
# layout, or the advertised output mode. (Socket name and default window size
# only take effect on restart.) A parse error on save is ignored — Spatil keeps
# the last-good config rather than reverting to defaults.

# Split your config across files with `include`. Paths are relative to THIS
# file's directory. Included files OVERRIDE this file, and later entries override
# earlier ones — tables merge per-key, scalars/arrays are replaced. Handy for
# keeping personal overrides in a file that a shipped/updated base won't touch.
# (Duplicate keys within a SINGLE file are a TOML error; cross-file, later wins.)
# include = ["local.toml"]

[general]
# Base name of the IPC control socket. Resolved to
# $XDG_RUNTIME_DIR/<socket_name>.sock (falls back to /tmp if unset). Automation
# scripts connect here
socket_name = "spatil-0"

[display]
width = 1920
height = 1080
refresh_rate = 60000   # in mHz; 60000 = 60 Hz

# Native DRM backend only (ignored under the nested winit backend). Picks the
# physical connector and mode; defaults auto-detect the primary connected output.
[output]
connector = "auto"     # "auto" (first connected) or a name, e.g. "eDP-1", "HDMI-A-1"
mode = "auto"          # "auto" (preferred), "1920x1080", or "1920x1080@60"
scale = 1

[keyboard]
repeat_rate = 25       # repeats per second
repeat_delay = 200     # ms before repeat starts
xkb_layout = "us"
xkb_model = "pc105"

[windows]
default_width = 800
default_height = 600
# Map-postponement budget (ms). A freshly committed window stays hidden this
# long while IPC scripts get a chance to position it, so it appears already at
# its final spot instead of flickering from the default location. With no script
# connected the window is revealed immediately, ignoring this value.
map_timeout_ms = 80

# The 3D environment. `mode` selects the scene: "strata" (windows floating above
# a bounded grid floor) or "aether" (weightless billboard panes in a dark void).
# Each mode has its own sub-table below; only the active one is used, but both
# hot-reload on save so you can switch live. Colors are #RRGGBB or #RRGGBBAA
# (sRGB, as a color picker reports them).
[scene_graph]
mode = "strata"             # "strata" | "aether"

# Strata: windows recline above a bounded grid floor, lit by one directional
# light, viewed by a fixed camera looking at the origin (the reference model).
# Colors, camera/window angles, grid, fog and the light position hot-reload.
[scene_graph.strata]
enable_shadows = true       # windows cast shadows onto the grid floor
camera_distance = 3.0       # camera distance from the origin
camera_elevation = 0.0      # degrees the camera is lifted above horizontal (0 = straight-on)
camera_orbit = 0.0          # degrees the camera orbits around Y (0 = front)
window_pitch = 45.0         # degrees each window reclines back toward the camera
window_base_y = -0.2        # Y the window cluster is centered at (above the grid)
window_base_z = -0.5        # Z the window cluster is pushed back to
light_position = [1.0, 2.0, 1.0]  # world-space (X, Y, Z) of the light
grid_color = "#2A2A30"      # grid-line color
void_color = "#0A0A0C"      # empty-space / background color
axis_color = "#2A2A30"      # unused center-axis color (kept = grid_color)
grid_level = -0.6           # Y height of the grid floor plane
grid_extent = 5.0           # grid half-size (square, centered at the origin)
grid_spacing = 0.2          # world-space distance between grid lines
fog_density = 0.15          # exponential fog: higher = grid fades nearer
shadow_map_size = 2048      # shadow map resolution in px (square); restart to change

# Aether: flat billboard windows floating in a dark void among a real 3D field
# of scattered particles (points with size-attenuation), viewed by a camera that
# orbits with the cursor so near particles parallax faster than far ones.
[scene_graph.aether]
void_color = "#0F0F11"      # deep-space backdrop / clear color
particle_color = "#D1D1D6"  # particle (star) color
particle_count = 2000       # number of particles in the field
particle_size = 0.005       # particle world-space size (grows nearer via perspective)
particle_opacity = 0.8      # particle alpha
field_width = 5.0           # half-extent of the particle volume in X
field_height = 3.0          # half-extent of the particle volume in Y
field_depth = 8.0           # depth of the particle volume behind the origin (−Z)
fog_density = 0.15          # exponential fog: higher = particles fade nearer
camera_distance = 2.5       # camera distance from the origin on +Z
parallax_enabled = true     # orbit the camera with the cursor
parallax_strength = 0.25    # max camera shift (world units) from the cursor
glass_alpha = 0.95          # window opacity (lower = more see-through)
glass_tint = "#12141A"      # tint blended under the surface
glass_tint_strength = 0.1   # 0 = pure surface, 1 = full tint
z_layer_gap = 0.35          # Z distance between successive window layers

# Animations. The Strata⇄Aether switch is a fluid camera + geometry + environment
# crossfade (never a snap); windows emerge/unfold on open and dissipate/collapse
# on close. Durations hot-reload. Set enabled = false for instant snaps.
[animation]
enabled = true
switch_ms = 500     # scene-switch choreography (ms)
open_ms = 250       # window open animation (ms)
close_ms = 220      # window close animation (ms)
present_ms = 280    # present/dismiss/fullscreen animation, and the backdrop dim (ms)
# Physics for thrown windows and the smoothed camera. `damping` is the fraction of
# a throw's speed left after one second: lower stops it sooner (0.02 = brisk).
# The spring settles the grab-lift on release and smooths camera moves; stiffness
# is how hard it pulls, damping how much it resists overshoot. Roughly, damping
# near 2*sqrt(stiffness) settles without a bounce, below it bounces.
damping = 0.02
spring_stiffness = 220.0
spring_damping = 22.0

# World interaction: how you drag windows around the 3D world and move the camera.
#
# Nothing here happens unless `world_modifier` is held -- without it every pointer
# event goes to the application untouched, so apps keep working normally.
#
# The Left button is a universal grab, and what is under it decides what you grab:
#
#   <mod> + Left-drag ON A WINDOW    move it on the plane parallel to your screen
#                                    (left/right, up/down, every diagonal)
#   <mod> + Right-drag ON A WINDOW   push it away / pull it closer
#   <mod> + Left-drag ON THE WORLD   orbit the world around what you are looking at
#   <mod> + Shift + Left-drag        pan: slide what you are looking at
#   <mod> + Left-CLICK THE WORLD     fly there: the camera travels to that point
#   <mod> + scroll                   push/pull the window during a drag; otherwise
#                                    zoom toward the cursor, and once zoomed in all
#                                    the way KEEP SCROLLING to walk into the world --
#                                    point at a far/deep window and scroll to fly to
#                                    it, however deep it is (there is no zoom wall)
#
# Middle-drag orbits (Shift+Middle pans) too, if you have a middle button.
#
# Orbit, pan, fly and zoom all work in BOTH scenes. Together they reach any
# viewpoint: pan/fly put you over the thing you care about, orbit swings around it
# (so you can see its back), zoom closes the distance. `look_at` over the IPC
# socket jumps the camera to an explicit coordinate. New windows open under the
# cursor at the depth you are focused on, so they appear where you are looking.
#
# Windows stay exactly where you put them -- there is no snapping and no layout
# grid. Placement is remembered per scene, so flipping strata⇄aether and back
# restores each mode's arrangement instead of resetting it. Release with a flick
# to throw a window; it glides on and damps to rest where it lands.
[input]
world_modifier = "Super"      # Super | Ctrl | Alt | Shift (aliases as in [keybindings])
orbit_speed = 0.005           # radians of orbit per pixel dragged
pan_speed = 0.002             # world units panned per pixel dragged
zoom_speed = 0.1              # fraction of the camera distance per scroll notch
drag_depth_speed = 0.05       # world units of push/pull per scroll notch or pixel
move_step = 0.25              # world units the "move_window <dir>" action shoves
invert_scroll_zoom = false    # flip the scroll direction for zoom and depth
focus_border_enabled = true   # outline the keyboard-focused window
focus_border_color = "#4A90E2"
focus_border_width = 0.004    # world units (not pixels), so it stays even on both axes
backdrop_dim = 0.55           # how far the world darkens behind a presented window
backdrop_dim_color = "#000000"
present_fill = 0.8            # fraction of the screen a presented window covers

# Familiar: the native orb that replaces a taskbar/status bar. It is the system
# clock, and after `idle_ms` of stillness it slides into an ambient mode where a
# dot revolves around its perimeter to track seconds. Set familiar_enabled = false
# if you would rather run your own zwlr_layer_shell_v1 panel (waybar, QuickShell,
# ags, ...) in its place -- the orb keeps out of any exclusive zone a panel claims,
# so the two can also coexist.
[shell]
familiar_enabled = true
familiar_corner = "bottom_right"  # top_left | top_right | bottom_left | bottom_right
                                  # Drag the orb to another corner and Spatil remembers it
                                  # in ~/.local/state/spatil/state.toml, which overrides this
                                  # value. Delete that file to come back to whatever is here,
                                  # or just edit this line -- an explicit change wins.
familiar_size = 56                # diameter in pixels
familiar_margin = 20              # inset from the screen corner in pixels
familiar_color = "#12161C"        # orb body
familiar_accent = "#4A90E2"       # hands, rim and the revolving second dot
idle_ms = 5000                    # stillness before the orb goes ambient

# Autostart: commands run once when Spatil starts, via `sh -c`. The working
# directory is this config dir, so a relative path like "hooks/auto_place.py"
# resolves to ~/.config/spatil/hooks/auto_place.py (scripts must be executable).
# Use this for bars, wallpaper, and event-driven hooks. Children inherit
# WAYLAND_DISPLAY and SPATIL_SOCKET. Uncomment to enable the bundled example hook.
[autostart]
exec = [
  # "hooks/auto_place.py",
  # "waybar",
]

# Keybindings: "Combo" = "action".
#
# Combo syntax: modifiers joined with '+', then the key, e.g. "Super+Shift+Return".
#   Modifiers: Super (aliases: Logo/Win/Mod/Mod4), Ctrl (Control), Alt (Mod1/Meta), Shift.
#   Keys: any xkb keysym name, case-insensitive (Return, space, q, F1, Left, ...).
#   Letter keys are matched case-folded: "Super+Q" means Super+q; require Shift
#   explicitly with "Super+Shift+q".
#
# Actions:
#   "exec <command>" — run <command> via `sh -c`.
#   "hook <name>"    — run hooks/<name> (a script under this config's hooks/ dir).
#                      Meant for one-shot hooks that do a thing and exit; a
#                      long-running hook belongs in [autostart] instead.
#   "close_window"   — close the focused window.
#   "quit"           — exit the compositor.
#   "toggle_scene"   — switch between the Strata and Aether scene graphs.
#   "set_scene <strata|aether>" — switch to that scene explicitly.
#   "focus <left|right|up|down>" — focus the nearest window that way, as seen.
#   "move_window <left|right|up|down>" — shove the focused window a step that way.
#   "pan <left|right|up|down>" — slide the camera across the view plane.
#   "present"        — bring the focused window forward at a comfortable working
#                      size and dim the world behind it; press again to dismiss.
#                      The window is re-configured at the larger size (not just
#                      magnified), so text stays sharp. Click the dimmed world to
#                      dismiss too.
#   "dismiss"        — leave the presented state. Bind this to a bare key at your
#                      own risk: a bound key is ALWAYS taken from the app, which is
#                      why Escape is not bound to it by default.
#   "fullscreen"     — toggle real xdg fullscreen (apps can also request it).
#   "zoom <in|out>" / "reset_view" — move the camera / ease it back to default.
#   "orbit <left|right|up|down>" — nudge the camera around the world.
#   "tilt <up|down>" — recline the windows more or less (strata only; live).
#
# NOTE: defining this table replaces the built-in defaults entirely.
[keybindings]
"Super+Return" = "exec kitty"
"Super+e" = "exec dolphin"
"Super+w" = "exec zen-browser"
"Super+z" = "exec zeditor"
"Super+t" = "exec antigravity-ide"
"Super+q" = "close_window"
"Super+Shift+q" = "quit"
"Super+Tab" = "toggle_scene"
"Super+Left" = "focus left"
"Super+Right" = "focus right"
"Super+Up" = "focus up"
"Super+Down" = "focus down"
"Super+Shift+Left" = "move_window left"
"Super+Shift+Right" = "move_window right"
"Super+Shift+Up" = "move_window up"
"Super+Shift+Down" = "move_window down"
"Super+space" = "present"
"Super+f" = "fullscreen"
"Super+Shift+h" = "pan left"
"Super+Shift+l" = "pan right"
"Super+Shift+k" = "pan up"
"Super+Shift+j" = "pan down"
"Super+equal" = "zoom in"
"Super+minus" = "zoom out"
"Super+0" = "reset_view"
# Move Familiar between corners without the mouse:
# "Super+Shift+1" = "orb top_left"
# "Super+Shift+2" = "orb top_right"
# "Super+Shift+3" = "orb bottom_left"
# "Super+Shift+4" = "orb bottom_right"
"Super+bracketleft" = "orbit left"
"Super+bracketright" = "orbit right"
"Super+Prior" = "tilt up"      # Page Up
"Super+Next" = "tilt down"     # Page Down
# Escape is deliberately NOT bound to "dismiss": presenting vim and pressing Escape
# should change vim's mode, not throw the window back. Dismiss with Super+space
# again, or by clicking the dimmed world behind it.
# "Super+g" = "hook place_next.py"   # snap the next window you open to center
