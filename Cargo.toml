[package]
name = "spatil"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ephraim Shikanga <ephraimshikanga@gmail.com>"]
description = "A Wayland compositor for tiling and floating window management"
repository = "https://github.com/EphraimShikanga/spatil"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop"] }
wgpu = "30"
wgpu-hal = "30"
winit = "0.30"
calloop = { version = "0.14", features = ["signals"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pollster = "0.4.0"
cgmath = "0.18"
bytemuck = { version = "1", features = ["derive"] }
