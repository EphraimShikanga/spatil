[package]
name = "spatil"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ephraim Shikanga <ephraimshikanga@gmail.com>"]
description = "3D spatial Wayland compositor"
repository = "https://github.com/EphraimShikanga/spatil"

[dependencies]
# Backend features (backend_drm/gbm/libinput/session_libseat/udev) drive the native
# DRM/KMS path; renderer_gl / backend_egl are deliberately absent -- we render with
# wgpu, not Smithay's GlesRenderer. See dev/drm-backend.md.
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
] }
wgpu = "30"
wgpu-hal = "30"
# Both already in the tree transitively (ash via wgpu-hal's Vulkan backend);
# direct deps only for the VK_EXT_physical_device_drm query + makedev.
ash = "0.38"
libc = "0.2"
winit = "0.30"
calloop = { version = "0.14", features = ["signals"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pollster = "0.4.0"
cgmath = "0.18"
bytemuck = { version = "1", features = ["derive"] }
hecs = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
dirs = "6.0.0"
notify = "8.2.0"
zbus = "5"
freedesktop-icons = "0.4"
png = "0.18"
resvg = { version = "0.45", default-features = false }
cosmic-text = { version = "0.17.0", features = ["shape-run-cache"] }
futures-util = "0.3"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
